on: 

  push:

jobs:

  job1:

    name: Kermel build
    runs-on: ubuntu-latest
   # container:
         #  image: alpine:latest
    #docker:
        #images: alpine:3.16

    #runs-on: alpine:3.16

    env:

      BOT_API_KEY: ${{ secrets.BOT_API_KEY }}
      CHAT_ID: ${{ secrets.CHAT_ID }}

    steps:

    - uses: actions/checkout@v3
      with:
          fetch-depth: 1

    - name: build

      run: |
        sudo apt-get update -y
        sudo apt-get install mkbootimg zipalign -y
        bash build_kernel.sh
